version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metering_billing_postgres
    restart: always
    environment:
      POSTGRES_DB: metering_billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering_billing"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metering_billing_app
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metering_billing
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: metering_billing
      DB_USER: postgres
      DB_PASSWORD: postgres
      PAYMENT_PROVIDER: fake
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
