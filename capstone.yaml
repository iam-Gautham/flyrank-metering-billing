version: "1.0"
name: "flyrank-metering-billing"
description: "FlyRank Usage Metering & Billing Engine"
base_url: "http://localhost:3000"
commands:
  run: "npm start"
  seed: "npm run db:seed"
  migrate: "npm run db:migrate"
  test: "npm test"
endpoints:
  - path: "/"
    method: "GET"
    description: "Engine health check"
  - path: "/api/v1/generate"
    method: "POST"
    description: "Record AI completion usage with Idempotency-Key"
  - path: "/api/v1/usage"
    method: "GET"
    description: "Get tenant billing period usage summary"
  - path: "/api/v1/subscription"
    method: "GET"
    description: "Get active tenant subscription details"
  - path: "/api/v1/subscription/checkout"
    method: "POST"
    description: "Simulated zero-cost checkout session"
  - path: "/api/v1/subscription/cancel"
    method: "POST"
    description: "Cancel tenant active subscription"
  - path: "/api/v1/webhooks/payment"
    method: "POST"
    description: "Process payment-provider webhook lifecycle events"
